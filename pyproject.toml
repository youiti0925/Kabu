[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kabu"
version = "0.0.0"
description = "Stock analysis research and backtest platform (P0.9 docs-only stage)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "youiti0925" }]
license = { text = "Proprietary" }
keywords = ["stock", "backtest", "research", "trace"]

# Runtime dependencies are intentionally empty at P0.9.
# Concrete dependencies will be pinned per data source decision (DATA_SOURCES.md).
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Anti-FX-leak rules will be added once concrete code lands. See docs/ANTI_FX_LEAK.md.
